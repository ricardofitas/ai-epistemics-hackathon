name: Replay published TabMWP baselines
on:
  push:
    branches: [ricardo/external-contract-transfer-20261114]
    paths: ['experiments/tabmwp-archive-audit-20261114/RUN.json']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            experiments/external-contract-transfer-20261114
            experiments/tabmwp-archive-audit-20261114
      - name: Independently replay original outputs and tie rules
        run: python3 experiments/tabmwp-archive-audit-20261114/replay.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tabmwp-archive-audit
          path: experiments/tabmwp-archive-audit-20261114/result.json
