name: GAMMAF pinned full archive reproduction
on:
  push:
    branches: [ricardo/gammaf-full-reproduction-20261114]
    paths: [.reproduction/gammaf-full-20261114/LAUNCH.json]
permissions:
  contents: read
concurrency:
  group: gammaf-full-reproduction-20261114
  cancel-in-progress: false
jobs:
  reproduce:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Install bounded offline-analysis dependencies
        run: python -m pip install --only-binary=:all: --retries 0 --timeout 30 -r .reproduction/gammaf-full-20261114/requirements.txt
      - name: Verify frozen source and reproduction protocol
        run: python .reproduction/gammaf-full-20261114/run_reproduction.py preflight
      - name: Verify28 public sources and reproduce38 tests plus full offline runner
        timeout-minutes: 16
        run: python .reproduction/gammaf-full-20261114/run_reproduction.py run
      - name: Preserve complete reproduction evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gammaf-full-reproduction-${{ github.run_id }}
          path: .reproduction/gammaf-full-20261114/out
          retention-days: 90
          if-no-files-found: error
