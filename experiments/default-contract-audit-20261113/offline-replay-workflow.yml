name: Reproduce default-contract audit on supported Python 3.11 without inference
on:
  push:
    branches: [ricardo/default-contract-offline-replay-20261113]
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: experiments
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Install audit-only pinned dataframe dependencies
        run: python -m pip install pandas==2.2.3 numpy==2.3.5
      - name: Read immutable captures from the same private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 43515839794 --repo ricardofitas/swarm-adaption-hackathon --name default-contract-source-panel-43515839794 --dir experiments/default_contract_source_capture_20261113
          gh run download 43517809338 --repo ricardofitas/swarm-adaption-hackathon --name default-contract-model-smoke-43517809338 --dir experiments/default_contract_model_capture_20261113
          gh run download 43519207330 --repo ricardofitas/swarm-adaption-hackathon --name default-contract-locked-support-43519207330 --dir experiments/default_contract_locked_support_v2_20261113
      - name: Recompute source, CLI, model and prompt evidence without new model calls
        working-directory: experiments/default-contract-audit-20261113
        run: |
          python audit_contracts.py
          python independent_source_audit.py
          python verify_public_metric_cli.py
          python validate_source_correction.py
          python validate_prompt_correction.py
          python verify_native_prompt_wire.py
          python verify_model_capture.py
          python analyze_model_smoke.py
      - name: Record supported runtime
        if: always()
        working-directory: experiments/default-contract-audit-20261113
        run: python -c 'import json,sys,pandas,numpy; from pathlib import Path; Path("SUPPORTED_RUNTIME_REPLAY.json").write_text(json.dumps({"python":sys.version,"pandas":pandas.__version__,"numpy":numpy.__version__,"new_model_calls":0},indent=2))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: default-contract-supported-replay-${{ github.run_id }}
          path: |
            experiments/default-contract-audit-20261113/results
            experiments/default-contract-audit-20261113/SUPPORTED_RUNTIME_REPLAY.json
          retention-days: 90
