name: Frozen epistemics P1 gap replication 30 families
on:
  push:
    branches: [ricardo/epistemics-gap-p1-20261113]
    paths:
      - experiments/gap-replication-20261113/runtime/LAUNCH.json
permissions:
  contents: read
  actions: read
concurrency:
  group: frozen-epistemics-gap-p1-20261113
  cancel-in-progress: false
jobs:
  capture:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /experiments/gap-replication-20261113/runtime/
            /scripts/run_adaption_stream_pilot.py
            /ci_gap_p1_20261113/execute.py
            /ci_gap_p1_20261113/execution_pins.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Verify frozen 80-row plan without model calls
        run: python ci_gap_p1_20261113/execute.py preflight
      - name: Execute fixed P1 gap replication cohort once using existing repository secret
        timeout-minutes: 90
        env:
          ADAPTION_API_KEY: ${{ secrets.ADAPTION_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python ci_gap_p1_20261113/execute.py run
      - name: Check sanitized complete or partial capture
        id: scan
        if: always()
        env:
          ADAPTION_API_KEY: ${{ secrets.ADAPTION_API_KEY }}
        run: python ci_gap_p1_20261113/execute.py finalize
      - name: Preserve complete and partial evidence
        if: always() && steps.scan.outputs.safe == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gap-p1-${{ github.run_id }}
          path: experiments/gap-replication-20261113/runtime/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: false
